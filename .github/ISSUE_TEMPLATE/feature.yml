name: Feature request
description: A new capability, or a change to how something should behave.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the user trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be possible once this exists? Describe behavior, not implementation.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we'd know it's done
      description: Observable, checkable outcomes (these seed the spec's success criteria).
      placeholder: |
        - ...
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related things this request does NOT include.
