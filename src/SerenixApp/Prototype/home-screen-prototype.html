<!doctype html>
<!--
  PROTOTYPE — throwaway, never merged (branch prototype/homescreen).
  Question: what should the Serenix home screen look like?
  Four structurally different home screens (A–D), plus E combining the owner's picks
  (A rings + date arrows, B Readiness hero/Baseline, C tiles, with C and D as Sleep/Trends tabs),
  switchable via ?variant=A..E,
  the floating bar at the bottom, or the ← → keys. Scenario via ?scenario=.
  Run: double-click this file. Mock data only; nothing is stored.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Screen Prototype</title>
<style>
  :root {
    --bg: #e9e9ee; --panel: #fff; --ink: #111; --sub: #666;
    --s-bg: #000; --s-card: #1c1c1e; --s-card2: #2c2c2e; --s-ink: #f5f5f7; --s-sub: #8e8e93;
    --track: #3a3a3c; --sep: #38383a;
    --sleep: #818cf8; --load: #fb923c; --good: #4ade80; --mid: #fbbf24; --low: #fb7185; --hr: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  .stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px 16px 96px; flex-wrap: wrap; }

  /* phone */
  .phone { width: 390px; max-width: 100%; height: 844px; border-radius: 52px; border: 12px solid #111; background: var(--s-bg); position: relative; overflow: hidden; color: var(--s-ink); box-shadow: 0 20px 50px rgba(0,0,0,.25); flex: none; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0; font-weight: 600; font-size: 15px; z-index: 5; background: linear-gradient(var(--s-bg) 70%, transparent); }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; border-radius: 20px; background: #000; z-index: 6; }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 54px 18px 40px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .tap { transition: opacity .1s; } .tap:active { opacity: .6; }
  .muted { color: var(--s-sub); }
  .card { background: var(--s-card); border-radius: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--s-card2); color: var(--s-sub); }
  .pill.err { background: #3b1219; color: #fda4af; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .spin { width: 10px; height: 10px; border: 2px solid var(--s-sub); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .navbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--s-card); display: grid; place-items: center; font-size: 18px; }
  .navbtn[disabled] { opacity: .3; cursor: default; }
  .up { color: var(--good); } .down { color: var(--low); }

  /* variant F: light restyle, purple accent; dark via Appearance */
  .phone.f { --s-bg: #f3f2f8; --s-card: #fff; --s-card2: #efeafe; --s-ink: #16151c; --s-sub: #8b8a97;
    --track: #e7e4f2; --sep: #efedf5; --accent: #7c5cff; --accent-ink: #fff; --shadow: 0 4px 16px rgba(40,30,90,.07);
    --good: #22c55e; --mid: #f59e0b; --low: #ef4444; border-color: #1a1a1a; }
  .phone.f.dark { --s-bg: #0f0e14; --s-card: #1c1b24; --s-card2: #2a2440; --s-ink: #f4f3f8; --s-sub: #8f8d9e;
    --track: #2f2d3b; --sep: #2a2934; --accent: #9b85ff; --accent-ink: #fff; --shadow: none;
    --good: #4ade80; --mid: #fbbf24; --low: #fb7185; }
  .phone.f .card, .phone.f .f-card { background: var(--s-card); border-radius: 22px; box-shadow: var(--shadow); }
  .phone.f .backdrop { background: rgba(20,15,40,.35); }
  .f-top { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
  .f-av { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
  .f-hi { flex: 1; line-height: 1.2; } .f-hi small { color: var(--s-sub); font-size: 12px; display: block; } .f-hi b { font-size: 17px; }
  .f-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--s-card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 17px; flex: none; }
  .f-week { padding: 14px 14px 12px; margin-bottom: 14px; }
  .f-week .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .f-week .hd b { font-size: 17px; }
  .f-arrow { width: 30px; height: 30px; border-radius: 50%; background: var(--s-card2); display: grid; place-items: center; color: var(--accent); font-size: 16px; }
  .f-arrow[disabled] { opacity: .35; cursor: default; }
  .f-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
  .f-day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0 8px; border-radius: 16px; font-size: 12px; color: var(--s-sub); }
  .f-day b { font-size: 15px; color: var(--s-ink); font-weight: 600; }
  .f-day.sel { background: var(--accent); color: var(--accent-ink); } .f-day.sel b { color: var(--accent-ink); }
  .f-day.off { opacity: .35; cursor: default; } .f-day.none b { color: var(--s-sub); }
  .f-rings { display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 6px 12px; margin-bottom: 14px; }
  .f-ring { display: flex; flex-direction: column; align-items: center; position: relative; }
  .f-ring .in { position: absolute; top: 0; height: 84px; display: grid; place-items: center; font-weight: 800; font-size: 24px; }
  .f-ring .lbl { font-size: 12px; color: var(--s-sub); margin-top: 6px; } .f-ring .word { font-size: 13px; font-weight: 700; }
  .f-sec { font-size: 17px; font-weight: 700; margin: 6px 4px 10px; }
  .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .f-tile { padding: 14px; display: flex; gap: 8px; text-align: left; }
  .f-tile .nm { font-size: 13px; color: var(--s-sub); display: flex; gap: 6px; align-items: center; }
  .f-tile .ic { width: 26px; height: 26px; border-radius: 50%; background: var(--s-card2); display: grid; place-items: center; font-size: 13px; color: var(--accent); }

  .f-tile .st { font-size: 13px; font-weight: 600; }
  .f-gauge { width: 12px; height: 70px; border-radius: 6px; background: var(--track); position: relative; margin-left: auto; align-self: center; flex: none; }
  .f-gauge .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px; opacity: .75; }
  .f-gauge .knob { position: absolute; left: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid; transform: translate(-50%, 50%); }
  .f-pill { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 8; background: var(--s-card); box-shadow: 0 6px 20px rgba(40,30,90,.18); border-radius: 99px; padding: 8px 16px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1.5px solid var(--track); animation: drop .25s ease-out; }
  @keyframes drop { from { transform: translate(-50%, -30px); opacity: 0; } }
  .f-pill .bar { width: 160px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; } .f-pill .bar i { display: block; height: 100%; background: var(--accent); }
  .phone.f .tabbar { background: var(--s-card); box-shadow: 0 -2px 16px rgba(40,30,90,.06); }
  .phone.f .tabbar button.on { color: var(--accent); }
  .phone.f .m-list { background: var(--s-bg); }
  .f-seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--s-card2); border-radius: 12px; padding: 3px; }
  .f-seg button { text-align: center; padding: 7px 0; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--s-sub); }
  .f-seg button.on { background: var(--s-card); color: var(--s-ink); box-shadow: var(--shadow); }
  .f-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
  .f-cal button, .f-cal span { padding: 9px 0; border-radius: 50%; font-size: 14px; }

  /* sheet */

  .b-hero { margin: 26px 0 6px; }

  .b-bar > .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--s-sub); }
  .b-hist .item { display: flex; justify-content: space-between; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--sep); }

  /* C — night timeline */
  .c-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 16px; }
  .c-day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; font-size: 11px; color: var(--s-sub); }
  .c-day b { font-size: 16px; color: var(--s-ink); }
  .c-day.sel { background: var(--s-card2); }
  .c-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .c-chip { padding: 10px 12px; }
  .c-chip .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .c-tile { padding: 12px; }
  .c-tile .v { font-size: 22px; font-weight: 700; }

  /* D — trends */

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--s-card); border-radius: 9px; padding: 2px; margin: 12px 0 16px; }

  .seg button.on { background: var(--s-card2); }
  .d-row { display: grid; grid-template-columns: 1fr 120px 64px; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--sep); width: 100%; }
  .d-row:last-child { border-bottom: 0; }
  .d-row .v { text-align: right; font-size: 20px; font-weight: 700; }

  /* E/F — combined, with tab bar */
  .e-rings { display: flex; justify-content: space-between; align-items: flex-end; margin: 18px 0 6px; }
  .e-ring { position: relative; text-align: center; }
  .e-ring .in { position: absolute; top: 0; left: 0; right: 0; display: grid; place-content: center; }
  .e-ring .lbl { margin-top: 6px; font-size: 12px; font-weight: 600; }
  .e-word { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 4px; }
  .e-sec { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--s-sub); margin: 22px 4px 8px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 10px 0; background: rgba(28,28,30,.94); border-top: 1px solid var(--sep); z-index: 8; }
  .tabbar button { text-align: center; font-size: 11px; color: var(--s-sub); }
  .tabbar button b { display: block; font-size: 20px; line-height: 1.3; }
  .tabbar button.on { color: var(--s-ink); }

  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--s-card2); display: grid; place-items: center; }
  .sheet.tall { max-height: 92%; min-height: 92%; }
  .m-sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--s-sub); margin: 20px 4px 6px; }
  .m-list { background: var(--s-card2); border-radius: 12px; }
  .m-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-bottom: 1px solid var(--sep); }
  .m-item:last-child { border-bottom: 0; }
  .m-item .ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 15px; flex: none; }
  .m-item .tx { flex: 1; min-width: 0; }
  .m-item .tx small { display: block; color: var(--s-sub); font-size: 12px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--good); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .switch.off { background: var(--track); } .switch.off::after { right: auto; left: 2px; }
  .toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--s-ink); color: #000; font-size: 13px; padding: 8px 14px; border-radius: 10px; z-index: 20; white-space: nowrap; }

  /* empty */
  .empty { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 0 20px; }
  .bigbtn { background: var(--s-ink); color: #000; font-weight: 600; padding: 13px 28px; border-radius: 14px; text-align: center; }

  /* prototype panel + switcher (not part of the design) */
  .panel { width: 340px; max-width: 100%; background: var(--panel); border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .panel h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--sub); }
  .panel .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

  .switcher button:hover { background: rgba(255,255,255,.2); }
  .switcher span { min-width: 210px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>08:12</span><span>●●● ▮</span></div>
    <div class="screen" id="screen"></div>
    <div id="tabbar"></div>
    <div id="sheet"></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div class="switcher">
  <button data-act="prev-variant" title="Previous variant (←)">‹</button>
  <span id="vlabel"></span>
  <button data-act="next-variant" title="Next variant (→)">›</button>
</div>

<script>
// ---------- mock data (deterministic) ----------
let seed = 42;
const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const TODAY = new Date(2026, 10, 1);
const NOW_MIN = 8 * 60 + 12;

const RAW = [];
for (let i = 0; i < 30; i++) {
  const date = new Date(TODAY); date.setDate(date.getDate() - i);
  // times are minutes from local midnight of the Night's date (negative = evening before)
  const onset = -75 + Math.round(R() * 70) + (i === 3 ? 80 : 0);
  const wake = 380 + Math.round(R() * 70);
  const wakeMins = 8 + Math.round(R() * 32);
  const bedStart = onset - 8 - Math.round(R() * 20);
  const bedEnd = wake + 4 + Math.round(R() * 18);
  let rhr = Math.round(51 + R() * 6 + (i === 3 ? 6 : 0));
  let hrv = Math.round(54 + R() * 16 - (i === 3 ? 15 : 0));
  if (i === 0) { rhr = 51; hrv = 67; }
  const resp = +(13.8 + R() * 1.2 + (i === 3 ? 0.8 : 0)).toFixed(1);
  const skin = +(33.7 + R() * 0.6 + (i === 3 ? 0.4 : 0)).toFixed(1);
  const spo2 = Math.round(95 + R() * 3);
  const asleep = wake - onset - wakeMins;
  const sleepScore = clamp(Math.round(asleep / 480 * 80 + (1 - wakeMins / 60) * 20), 1, 100);
  // heart rate every 5 min across the Sleep Period, with a couple of wake bouts
  const hr = [], n5 = Math.floor((wake - onset) / 5);
  const bouts = [Math.floor(R() * n5), Math.floor(R() * n5)];
  for (let k = 0; k <= n5; k++) {
    let v = rhr + 11 * Math.exp(-k / 18) + 2.5 * Math.sin(k / 8) + R() * 2.5;
    if (k > n5 * 0.85) v += (k - n5 * 0.85) * 0.4;
    if (bouts.some(b => Math.abs(b - k) < 2)) v += 13;
    hr.push(Math.round(v));
  }
  // Load for the Day: hourly contributions, a workout or two; today only up to now
  const hourly = [];
  const workout = 7 + Math.floor(R() * 12);
  for (let h = 0; h < 24; h++) {
    let v = h < 7 || h > 22 ? R() * 0.2 : 0.4 + R() * 1.2;
    if (h === workout) v += 14 + R() * 22;
    if (i === 0 && h === 7) v += 6;
    hourly.push(i === 0 && h > 8 ? null : +v.toFixed(1));
  }
  const load = Math.round(hourly.reduce((s, x) => s + (x || 0), 0));
  RAW.push({ i, date, onset, wake, wakeMins, bedStart, bedEnd, asleep, rhr, hrv, resp, skin, spo2, sleepScore, hr, hourly, load, today: i === 0 });
}

// Baseline from up to 14 earlier Nights; Readiness is Calibrating until 4 Nights exist
function derive(list) {
  return list.map((n, i) => {
    const prior = list.slice(i + 1, i + 15);
    const count = list.length - i;
    let base = null, readiness = null;
    if (count >= 4) {
      // Baseline widened to resp/skin (proposed glossary change); SpO2 uses fixed levels instead
      base = Object.fromEntries(['hrv', 'rhr', 'resp', 'skin'].map(k => [k, avg(prior.map(p => p[k]))]));
      readiness = clamp(Math.round(58 + 140 * (n.hrv - base.hrv) / base.hrv - 3.5 * (n.rhr - base.rhr) + (n.sleepScore - 75) * 0.5), 1, 99);
    }
    return { ...n, base, readiness, nightsSoFar: count };
  });
}

const METRICS = [
  { key: 'rhr', name: 'Resting HR', unit: 'bpm', fmt: v => v, better: -1 },
  { key: 'hrv', name: 'HRV', unit: 'ms', fmt: v => v, better: 1 },
  { key: 'resp', name: 'Respiratory rate', unit: 'br/min', fmt: v => v.toFixed(1) },
  { key: 'skin', name: 'Skin temperature', unit: '°C', fmt: v => v.toFixed(1) },
  { key: 'spo2', name: 'SpO2', unit: '%', fmt: v => v },
];

// ---------- state ----------
const SCENARIOS = {
  normal: 'Synced',
  calibrating: 'Calibrating (2 Nights)',
  syncing: 'Syncing on open',
  failed: 'Sync failed',
  first: 'First launch',
};
const VARIANTS = { A: 'Score rings', B: 'Briefing', C: 'Night timeline', D: 'Trends', E: 'Combined', F: 'Light restyle' };
const TABS = { today: ['◉', 'Today'], sleep: ['☾', 'Sleep'], trends: ['∿', 'Trends'] };
const qs = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[qs.get('variant')] ? qs.get('variant') : 'A',
  scenario: SCENARIOS[qs.get('scenario')] ? qs.get('scenario') : 'normal',
  night: 0, sheet: null, range: 14, syncProgress: 0, tab: 'today', page: null, toast: null,
  appearance: 'system', name: 'Ellis', weekOffset: 0,
};
const combined = () => state.variant === 'E' || state.variant === 'F';
const latestOnly = () => state.variant === 'D' || (combined() && state.tab === 'trends');
let timer = null;

function nights() {
  switch (state.scenario) {
    case 'calibrating': return derive(RAW.slice(0, 2));
    case 'syncing': case 'failed': return derive(RAW).slice(1); // latest Night not on the phone yet
    case 'first': return [];
    default: return derive(RAW);
  }
}

// ---------- formatting ----------
const pad = n => String(n).padStart(2, '0');
const clock = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const dur = m => `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dlabel = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const nightName = n => n.today ? 'Last night' : dlabel(n.date);
const band = r => r == null ? 'var(--s-sub)' : r >= 67 ? 'var(--good)' : r >= 34 ? 'var(--mid)' : 'var(--low)';
const bandWord = r => r == null ? 'Calibrating' : r >= 67 ? 'Ready' : r >= 34 ? 'Steady' : 'Take it easy';
const loadLabel = n => n.today ? 'so far today' : 'that Day';
function delta(n, key) {
  if (!n.base) return '';
  const d = n[key] - n.base[key];
  const good = key === 'hrv' ? d >= 0 : d <= 0;
  const txt = key === 'hrv' ? `${d >= 0 ? '+' : ''}${Math.round(d / n.base.hrv * 100)}%` : `${d >= 0 ? '+' : ''}${d.toFixed(0)} bpm`;
  return `<span class="${good ? 'up' : 'down'}">${txt}</span>`;
}

function syncStatus(style) {
  const s = state.scenario;
  if (s === 'syncing') {
    const recs = Math.round(state.syncProgress / 100 * 28640).toLocaleString();
    return style === 'text' ? `Syncing with your Strap… ${recs} of 28,640 History Records`
      : `<span class="pill"><span class="spin"></span>Syncing · ${state.syncProgress}%</span>`;
  }
  if (s === 'failed') return style === 'text' ? `Couldn't reach your Strap. Showing data up to Sat 07:12. <button class="tap" data-act="sync" style="color:var(--sleep)">Retry</button>`
    : `<button class="pill err tap" data-act="sync">⚠ Strap not found · Retry</button>`;
  return style === 'text' ? 'Synced with your Strap at 08:10' : `<button class="pill tap" data-act="sync"><span class="dot" style="background:var(--good)"></span>Synced 08:10</button>`;
}

// ---------- tiny charts ----------
function ring(v, max, color, size, stroke) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = v == null ? 0 : Math.min(1, v / max), h = size / 2;
  return `<svg width="${size}" height="${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}" ${v == null ? 'stroke-dasharray="2 6"' : ''}/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 ${h} ${h})"/></svg>`;
}
function spark(vals, w, h, color, bandRange) {
  const v = vals.filter(x => x != null);
  if (v.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  let lo = Math.min(...v), hi = Math.max(...v);
  if (bandRange) { lo = Math.min(lo, bandRange[0]); hi = Math.max(hi, bandRange[1]); }
  const p = (hi - lo) * 0.15 || 1; lo -= p; hi += p;
  const x = i => 3 + i * (w - 6) / (vals.length - 1), y = val => h - 3 - (val - lo) / (hi - lo) * (h - 6);
  const pts = vals.map((val, i) => val == null ? null : `${x(i).toFixed(1)},${y(val).toFixed(1)}`).filter(Boolean);
  const bandSvg = bandRange ? `<rect x="0" width="${w}" y="${y(bandRange[1])}" height="${Math.max(1, y(bandRange[0]) - y(bandRange[1]))}" fill="${color}" opacity=".13"/>` : '';
  const last = vals.length - 1;
  return `<svg width="${w}" height="${h}">${bandSvg}<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals[last] != null ? `<circle cx="${x(last)}" cy="${y(vals[last])}" r="3.5" fill="${color}"/>` : ''}</svg>`;
}
function nightChart(n, w, h) {
  const t0 = n.bedStart, t1 = n.bedEnd, top = 8, bot = h - 22;
  const x = t => (t - t0) / (t1 - t0) * w;
  const lo = Math.min(...n.hr) - 3, hi = Math.max(...n.hr) + 3;
  const y = v => bot - (v - lo) / (hi - lo) * (bot - top);
  const pts = n.hr.map((v, k) => `${x(n.onset + k * 5).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const lab = (t, txt, anchor) => `<text x="${clamp(x(t), 16, w - 16)}" y="${h - 6}" font-size="10" fill="var(--s-sub)" text-anchor="${anchor}">${txt}</text>`;
  return `<svg width="${w}" height="${h}" style="display:block">
    <rect x="${x(n.onset)}" y="${top - 4}" width="${x(n.wake) - x(n.onset)}" height="${bot - top + 8}" fill="var(--sleep)" opacity=".12" rx="6"/>
    <line x1="${x(n.onset)}" x2="${x(n.onset)}" y1="${top - 4}" y2="${bot + 4}" stroke="var(--sleep)" stroke-dasharray="2 3"/>
    <line x1="${x(n.wake)}" x2="${x(n.wake)}" y1="${top - 4}" y2="${bot + 4}" stroke="var(--sleep)" stroke-dasharray="2 3"/>
    <line x1="0" x2="${w}" y1="${y(n.rhr)}" y2="${y(n.rhr)}" stroke="var(--s-sub)" stroke-dasharray="1 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--hr)" stroke-width="1.6" stroke-linejoin="round"/>
    ${lab(n.onset, clock(n.onset), 'middle')}${lab(n.wake, clock(n.wake), 'middle')}
  </svg>`;
}
function loadBars(n, w, h) {
  const max = Math.max(10, ...n.hourly.filter(x => x != null)), bw = w / 24;
  return `<svg width="${w}" height="${h + 14}">${n.hourly.map((v, i) => v == null
    ? `<rect x="${i * bw + 1}" y="${h - 2}" width="${bw - 2}" height="2" fill="var(--track)"/>`
    : `<rect x="${i * bw + 1}" y="${h - Math.max(2, v / max * h)}" width="${bw - 2}" height="${Math.max(2, v / max * h)}" rx="2" fill="var(--load)"/>`).join('')}
    ${[0, 6, 12, 18].map(t => `<text x="${t * bw}" y="${h + 12}" font-size="10" fill="var(--s-sub)">${pad(t)}</text>`).join('')}</svg>`;
}

// ---------- shared bits ----------
function empty() {
  if (state.scenario === 'syncing') return `<div class="empty"><div class="spin" style="width:28px;height:28px;border-width:3px"></div>
    <h2 style="margin:0">Getting your first Night</h2><div class="muted">${syncStatus('text')}</div><div class="muted" style="font-size:13px">Keep the app open and the Strap nearby.</div></div>`;
  return `<div class="empty"><div style="font-size:54px">⌚</div><h2 style="margin:0">Connect your Strap</h2>
    <div class="muted">Serenix reads your Whoop 5.0 over Bluetooth. Your first Night appears after you sleep with it on.</div>
    <button class="bigbtn tap" data-act="sync">Pair Strap</button></div>`;
}
function navArrows(list) {
  return `<button class="navbtn tap" data-act="older" ${state.night >= list.length - 1 ? 'disabled' : ''}>‹</button>
          <button class="navbtn tap" data-act="newer" ${state.night === 0 ? 'disabled' : ''}>›</button>`;
}

// ---------- variant A: score rings + grouped list ----------

// ---------- variant B: briefing, one dominant score, text first ----------
const contrib = (label, value, frac, good) => `<div style="margin-bottom:14px"><div class="row"><span>${label}</span><b>${value}</b></div>
    <div class="b-bar"><span class="mid"></span><i style="background:${good ? 'var(--good)' : 'var(--low)'};${frac >= 0 ? `left:50%;width:${Math.min(50, frac * 50)}%` : `right:50%;width:${Math.min(50, -frac * 50)}%`}"></i></div></div>`;
function VariantB(list, n) {
  let hero, lede;

    hero = `<div class="b-word muted">Calibrating</div><div style="display:flex;gap:6px;margin-top:14px">${[0, 1, 2, 3].map(k => `<span style="flex:1;height:6px;border-radius:3px;background:${k < n.nightsSoFar ? 'var(--s-ink)' : 'var(--track)'}"></span>`).join('')}</div>`;
    lede = `Serenix needs <b>4 Nights</b> to learn your Baseline before it can rate Readiness. ${n.nightsSoFar} down, ${4 - n.nightsSoFar} to go. You slept <b>${dur(n.asleep)}</b> ${n.today ? 'last night' : ''}.`;
  } else {
    const hd = Math.round((n.hrv - n.base.hrv) / n.base.hrv * 100), rd = Math.round(n.rhr - n.base.rhr);
    hero = `<button class="tap" data-act="sheet:readiness" style="display:block"><div class="b-word" style="color:${band(n.readiness)}">${bandWord(n.readiness)}</div><div class="b-num">${n.readiness}<span style="font-size:20px;font-weight:600" class="muted"> Readiness</span></div></button>`;
    lede = `You slept <b>${dur(n.asleep)}</b>, from ${clock(n.onset)} to ${clock(n.wake)}. HRV was <b>${Math.abs(hd)}% ${hd >= 0 ? 'above' : 'below'}</b> your Baseline and Resting HR <b>${rd === 0 ? 'right on' : `${Math.abs(rd)} bpm ${rd > 0 ? 'above' : 'below'}`}</b> it.`;
  }
  const others = list.slice(0, 7).map((m, k) => k === state.night ? '' : `<button class="item tap" data-act="night:${k}"><span>${m.today ? 'Today' : dlabel(m.date)}</span>
    <span><span style="color:${band(m.readiness)}">${m.readiness ?? '—'}</span> <span class="muted">·</span> <span style="color:var(--sleep)">${m.sleepScore}</span></span></button>`).join('');
  return `
  <div class="b-date"><span>${n.today ? `Good morning · ${dlabel(n.date)}` : dlabel(n.date)}</span>${syncStatus('pill')}</div>
  <div class="b-hero">${hero}</div>
  <div class="b-lede">${lede}</div>
  ${n.base ? `<div class="b-why">
    ${contrib('HRV vs Baseline', `${n.hrv} ms`, (n.hrv - n.base.hrv) / n.base.hrv * 4, n.hrv >= n.base.hrv)}
    ${contrib('Resting HR vs Baseline', `${n.rhr} bpm`, (n.base.rhr - n.rhr) / 6, n.rhr <= n.base.rhr)}

  </div>` : ''}
  <div class="row card tap" data-act="sheet:sleep" style="padding:14px;margin-bottom:8px"><span>Sleep Score</span><b style="color:var(--sleep);font-size:20px">${n.sleepScore}</b></div>

    <div class="b-bar"><i style="left:0;width:${n.load}%;background:var(--load)"></i></div></div>
  <div class="muted" style="font-size:13px;margin:22px 0 4px">${METRICS.map(m => `<button class="tap" data-act="sheet:m-${m.key}" style="text-decoration:underline dotted">${m.name} ${m.fmt(n[m.key])} ${m.unit}</button>`).join(' · ')}</div>

  <div class="b-hist">${others}</div>`;
}

// ---------- variant C: the Night itself is the hero ----------
function weekStrip(list) {
  const week = list.slice(0, 7).map((m, k) => ({ m, k })).reverse();
  return `<div class="c-week" style="margin-top:12px">${week.map(({ m, k }) => `<button class="c-day tap ${k === state.night ? 'sel' : ''}" data-act="night:${k}">
    ${DOW[m.date.getDay()].slice(0, 1)}<b>${m.date.getDate()}</b><span class="dot" style="background:${band(m.readiness)}"></span></button>`).join('')}</div>`;
}
// green / amber / red by distance from Baseline (made-up thresholds, to tune in the spec)
const STATUS = {
  hrv: (v, b) => { const d = (v - b) / b; return d >= -0.05 ? 'good' : d >= -0.15 ? 'mid' : 'low'; },
  rhr: (v, b) => { const d = v - b; return d <= 1 ? 'good' : d <= 4 ? 'mid' : 'low'; },
  resp: (v, b) => { const d = Math.abs(v - b); return d <= 0.5 ? 'good' : d <= 1 ? 'mid' : 'low'; },
  skin: (v, b) => { const d = Math.abs(v - b); return d <= 0.3 ? 'good' : d <= 0.6 ? 'mid' : 'low'; },
  spo2: v => v >= 95 ? 'good' : v >= 92 ? 'mid' : 'low', // fixed levels, no Baseline
};
const SPO2_LABEL = { good: '95% or above', mid: 'Below 95%', low: 'Below 92%' };
const statusColor = (n, key) => key === 'spo2' ? `var(--${STATUS.spo2(n.spo2)})`
  : n.base ? `var(--${STATUS[key](n[key], n.base[key])})` : 'var(--s-ink)';
function tileDelta(n, m) {
  if (m.key === 'spo2') return `<span style="color:${statusColor(n, 'spo2')}">${SPO2_LABEL[STATUS.spo2(n.spo2)]}</span>`;
  if (!n.base) return '<span class="muted">Calibrating</span>';
  const d = n[m.key] - n.base[m.key];
  const txt = m.key === 'hrv' ? `${Math.round(d / n.base.hrv * 100)}%` : m.key === 'rhr' ? `${Math.round(d)} bpm` : `${d.toFixed(1)}`;
  return `<span style="color:${statusColor(n, m.key)}">${d >= 0 ? '+' : ''}${txt}</span>`;
}
function metricTiles(list, n, first = '') {
  return `<div class="c-grid">${first}${METRICS.map(m => {
    const hist = list.slice(state.night, state.night + 7).map(x => x[m.key]).reverse();
    return `<button class="card c-tile tap" data-act="sheet:m-${m.key}"><div class="muted" style="font-size:12px">${m.name}</div>
      <div class="v" style="color:${statusColor(n, m.key)}">${m.fmt(n[m.key])} <span class="muted" style="font-size:12px;font-weight:400">${m.unit}</span></div>
      <div class="row"><span style="font-size:11px">${tileDelta(n, m)}</span>${spark(hist, 70, 22, 'var(--s-sub)')}</div></button>`;
  }).join('')}</div>`;
}
function VariantC(list, n) {
  return `
  <div class="row" style="margin-top:6px"><div style="font-size:28px;font-weight:800">${n.today ? 'Last night' : dlabel(n.date)}</div>${syncStatus('pill')}</div>

    ${nightChart(n, 326, 150)}

    <button class="card c-chip tap" data-act="sheet:readiness"><div class="muted" style="font-size:12px">Readiness</div><div class="v" style="color:${band(n.readiness)}">${n.readiness ?? `<span style="font-size:15px">${n.nightsSoFar}/4</span>`}</div></button>

// ---------- variant F: light restyle (purple accent, greeting top bar, week strip) ----------
const GAUGE_LIMIT = { hrv: 0.15, rhr: 4, resp: 1.0, skin: 0.6 };
function gaugePos(n, key) {
  const v = n[key];
  if (v == null) return null;
  if (key === 'spo2') return clamp((v - 88) / 12, 0, 1);
  if (!n.base) return null;
  const d = key === 'hrv' ? (v - n.base.hrv) / n.base.hrv : v - n.base[key];
  return clamp(0.5 + d / (2 * GAUGE_LIMIT[key]), 0, 1);
}
function statusWordF(n, key) {
  if (key === 'spo2') return SPO2_LABEL[STATUS.spo2(n.spo2)];
  if (!n.base) return 'Calibrating';
  const z = STATUS[key](n[key], n.base[key]);
  return z === 'good' ? 'Normal' : n[key] < n.base[key] ? 'Low' : 'High';
}
const ICONS = { rhr: '♥', hrv: '∿', resp: '≋', skin: '🌡', spo2: '💧' };
const greetingF = () => { const h = Math.floor(NOW_MIN / 60); return h >= 5 && h < 12 ? 'Good morning!' : h < 18 ? 'Good afternoon!' : 'Good evening!'; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function todayDate(list) { return list.length ? list[0].date : new Date(); }
function weekStripF(list) {
  const today = todayDate(list), shown = list[state.night].date;
  const earliest = list[list.length - 1].date;
  // The seven Days ending today (or a week earlier per ‹), so today is never stranded among future Days.
  const start = new Date(today); start.setDate(today.getDate() - 6 - 7 * state.weekOffset);
  const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  const canOlder = days[0] > earliest, canNewer = state.weekOffset > 0;
  return `<div class="f-card f-week"><div class="hd"><b>${MONTHS_LONG[days[6].getMonth()]} ${days[6].getFullYear()}</b>
      <span style="display:flex;gap:8px"><button class="f-arrow tap" data-act="week:older" ${canOlder ? '' : 'disabled'}>‹</button>
      <button class="f-arrow tap" data-act="week:newer" ${canNewer ? '' : 'disabled'}>›</button></span></div>
    <div class="f-days">${days.map(d => {
      const idx = list.findIndex(x => sameDay(x.date, d));
      const future = d > today && !sameDay(d, today), tooOld = d < earliest && !sameDay(d, earliest);
      const sel = sameDay(d, shown);
      const act = future || tooOld ? '' : idx >= 0 ? `night:${idx}` : 'toast:No Night recorded that Day';
      return `<button class="f-day tap ${sel ? 'sel' : ''} ${future || tooOld ? 'off' : ''} ${idx < 0 ? 'none' : ''}" ${act ? `data-act="${act}"` : 'disabled'}>
        ${'SMTWTFS'[d.getDay()]}<b>${d.getDate()}</b></button>`;

}

    <div class="opts">${Object.entries(SCENARIOS).map(([k, v]) => `<button data-act="scenario:${k}" class="${state.scenario === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    <h3>Variant</h3>
    <div class="opts">${Object.entries(VARIANTS).map(([k, v]) => `<button data-act="variant:${k}" class="${state.variant === k ? 'on' : ''}">${k} ${v}</button>`).join('')}</div>
    <p>Tap anything on the phone: rings, chips, rows and the chart open detail sheets; arrows, the week strip and recent Nights change the Night shown.</p>
    <h3>State</h3>
    <pre>${JSON.stringify({
      variant: `${state.variant} (${VARIANTS[state.variant]})`,
      ...(combined() ? { tab: state.tab } : {}),
      scenario: state.scenario,
      nightsOnPhone: list.length,
      sheet: state.sheet,
      ...(state.variant === 'F' ? { appearance: state.appearance, profileName: state.name || null } : {}),
      ...(state.scenario === 'syncing' ? { syncProgress: `${state.syncProgress}%` } : {}),
      night: shown ? {
        date: dlabel(shown.date), sleepOnset: clock(shown.onset), finalWake: clock(shown.wake),
        timeInBed: dur(shown.bedEnd - shown.bedStart), asleep: dur(shown.asleep),
        sleepScore: shown.sleepScore, readiness: shown.readiness ?? `Calibrating (${shown.nightsSoFar}/4)`,
        load: shown.load, restingHR: shown.rhr, hrv: shown.hrv, resp: shown.resp, skinTemp: shown.skin, spo2: shown.spo2,
        baseline: shown.base ? { hrv: +shown.base.hrv.toFixed(1), restingHR: +shown.base.rhr.toFixed(1) } : null,
      } : null,
    }, null, 2)}</pre>`;
  const url = new URL(location.href);
  url.searchParams.set('variant', state.variant); url.searchParams.set('scenario', state.scenario);
  try { history.replaceState(null, '', url); } catch (e) { /* file:// in some browsers */ }
}

function startSync() {
  clearInterval(timer);
  state.scenario = 'syncing'; state.syncProgress = 0; state.sheet = null;
  timer = setInterval(() => {
    state.syncProgress = Math.min(100, state.syncProgress + 3);
    if (state.syncProgress >= 100) {
      clearInterval(timer); state.scenario = 'normal'; state.night = 0;
      state.justSynced = true; setTimeout(() => { state.justSynced = false; render(); }, 3000);
    }
    render();
  }, 90);
  render();
}

function cycle(dir) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + dir + keys.length) % keys.length];
  state.sheet = null; render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const [act, arg] = el.dataset.act.split(':');
  if (act === 'prev-variant') return cycle(-1);
  if (act === 'next-variant') return cycle(1);
  if (act === 'variant') { state.variant = arg; state.sheet = null; }
  if (act === 'scenario') {
    clearInterval(timer); state.sheet = null; state.night = 0;
    if (arg === 'syncing') return startSync();
    state.scenario = arg;
  }
  if (act === 'sync') return startSync();
  if (act === 'older') state.night++;
  if (act === 'newer') state.night--;
  if (act === 'night') state.night = +arg;
  if (act === 'pick') { state.night = +arg; state.sheet = null; state.weekOffset = 0; }
  if (act === 'week') state.weekOffset = Math.max(0, state.weekOffset + (arg === 'older' ? 1 : -1));
  if (act === 'appearance') state.appearance = arg;
  if (act === 'rename') { const v = prompt('What should we call you?', state.name); if (v != null) state.name = v; }
  if (act === 'sheet') state.sheet = el.dataset.act.slice(6);
  if (act === 'close') { state.sheet = null; state.page = null; }
  if (act === 'page') state.page = arg === 'main' ? null : arg;
  if (act === 'toast') { state.toast = el.dataset.act.slice(6); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800); }
  if (act === 'range') state.range = +arg;
  if (act === 'tab') { state.tab = arg; state.sheet = null; document.getElementById('screen').scrollTop = 0; }
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); }
});

if (state.scenario === 'syncing') startSync(); else render();
</script>
</body>
</html>
